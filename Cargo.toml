[package]
name = "gd-launcher"
version = "2.0.0"
description = "Geometry Dash version manager for the terminal"
authors = ["GD Launcher contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gd_launcher_lib"
path = "src/lib.rs"

[[bin]]
name = "gd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs", "rt-multi-thread"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
walkdir = "2"
winreg = "0.52"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
