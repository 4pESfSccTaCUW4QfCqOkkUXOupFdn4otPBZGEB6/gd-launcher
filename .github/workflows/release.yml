name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# tauri-action creates the release, so the token needs write access. This is also
# granted at the job level; both are needed when the repo default is read-only.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cargo builds dominate the wall clock; the cache turns 12 minutes into 2.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GD Launcher ${{ github.ref_name }}"
          releaseBody: |
            Windows installer. Per-user, no admin prompt, WebView2 already present on Windows 11.

            Download `GD Launcher_*_x64-setup.exe` below.
          releaseDraft: true
          prerelease: false
